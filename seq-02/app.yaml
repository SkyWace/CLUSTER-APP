apiVersion: v1
kind: Namespace
metadata:
  name: demo-simple

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: demo-simple
data:
  APP_VERSION: "v1"

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: demo-simple
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: demo-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: api-config
          resources:
            requests:
              cpu: 25m
              memory: 40Mi
            limits:
              cpu: 300m
              memory: 150Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 3
---

apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: demo-simple
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 3000
  type: ClusterIP
